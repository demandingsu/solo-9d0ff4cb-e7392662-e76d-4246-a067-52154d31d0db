services:
  web:
    build: .
    image: manufacturing-reconciliation:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/app.db
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
    volumes:
      - reconciliation-data:/data
    restart: unless-stopped

volumes:
  reconciliation-data:
